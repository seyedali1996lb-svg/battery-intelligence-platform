name: Release

# Tag-driven. `git tag v0.2.0 && git push origin v0.2.0` builds the distribution,
# checks that the tag and the packaged version agree, attaches the artifacts to a
# GitHub release, and publishes to PyPI when a token is configured.
#
# The tag/version check is the point of the `build` job: a `v0.3.0` tag on a
# wheel that says 0.2.0 produces a release nobody can reproduce from its own
# tag, and that must fail before anything is uploaded anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # attach artifacts to the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Check the tag, pyproject and wheel all state one version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib, zipfile

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v"):
              tag = ref.removeprefix("v")
              assert tag == version, f"tag v{tag} != pyproject version {version}"
              print(f"tag v{tag} matches pyproject version")
          else:
              print(f"manual run — version {version} (no tag to compare)")

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(
                  n for n in zf.namelist() if n.endswith(".dist-info/METADATA")
              )
              metadata = zf.read(metadata_name).decode("utf-8")
          assert f"\nVersion: {version}\n" in metadata, metadata[:500]
          # The distribution name is not the import name (PyPI's `batlab` is an
          # unrelated hardware library), so pin the pairing here too.
          assert "\nName: battery-lab\n" in metadata, metadata[:500]
          assert any(n.startswith("batlab/py.typed") for n in zipfile.ZipFile(wheel).namelist()), \
              "PEP 561 marker missing from the wheel"
          print(f"{wheel.name} carries version {version} and batlab/py.typed")
          PY

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Evaluated here (not in a job-level `if`, which cannot read `secrets`)
      # so the workflow is honest in both states: publish when a token exists,
      # and say plainly that it did not when there is none.
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Attach the artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run of the same tag must not fail the job it already succeeded
          # at; the version check above is what stops a wrong upload.
          skip-existing: true

      - name: Say what was not published
        if: env.HAS_PYPI_TOKEN != 'true'
        run: |
          echo "::warning::PYPI_API_TOKEN is not set — the distribution was built, \
          checked and attached to the GitHub release, but nothing was published to PyPI."

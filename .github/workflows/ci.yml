name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
        continue-on-error: false

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Type check with pyright
        run: |
          pip install pyright
          pyright --pythonversion 3.10 src/ app/

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Audit knowledge graph provenance
        run: python scripts/audit_knowledge_graph_provenance.py

      - name: Check MODEL_VERSION bumped when model training code changed
        # Logic lives in scripts/check_model_version_bump.py (unit-tested in
        # tests/test_check_model_version_bump.py) rather than inline here --
        # an inline-only check has no way to verify it actually still catches
        # what it's meant to catch.
        run: python scripts/check_model_version_bump.py
        continue-on-error: true   # warning only, not blocking

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with notebook extras
        run: pip install --upgrade pip && pip install -e ".[notebooks]"

      - name: Execute notebooks
        # notebooks/_run_ci.py strips any cell tagged "skip-ci" before execution
        # (for a future notebook that needs a large one-time download this repo
        # doesn't commit) and fails the job if any remaining cell errors. Uses
        # nbclient directly rather than `jupyter nbconvert --execute
        # --TagRemovePreprocessor...`, which was verified NOT to actually strip
        # tagged cells before execution in this project's nbconvert version —
        # see the script's own docstring for how that was confirmed.
        run: python notebooks/_run_ci.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with docs extras
        run: pip install --upgrade pip && pip install -e ".[docs]"

      - name: Build docs (strict — broken links/nav fail the build)
        run: mkdocs build --strict

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
        continue-on-error: false

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Check MODEL_VERSION bumped when model training code changed
        run: |
          python -c "
          import subprocess, sys

          # Get list of changed files
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print('MODEL_VERSION check skipped (no prior commit).')
              sys.exit(0)
          changed = result.stdout.strip().splitlines()

          # FEATURE_VERSION used to be duplicated between src/bundle_cache.py and
          # batlab/validation/manifest.py, kept in sync only by this CI warning.
          # It now lives once in batlab/features/engineering.py and both modules
          # import it directly, so it is structurally impossible for it to drift
          # -- nothing to check here anymore for that half.
          #
          # What's left: src/bundle_cache.py's disk cache also stores trained
          # model bundles (batlab/models/gbrt.py), tracked by its own
          # MODEL_VERSION. That one genuinely can't be centralized -- nothing
          # else depends on gbrt.py's output shape -- so it still needs a human
          # to remember to bump it, and this check still only warns.
          model_changed  = any(f == 'batlab/models/gbrt.py' for f in changed)
          bundle_changed = any(f == 'src/bundle_cache.py' for f in changed)

          if model_changed and not bundle_changed:
              print('WARNING: batlab/models/gbrt.py changed but src/bundle_cache.py')
              print('(app disk-cache MODEL_VERSION) was not updated. Stale cached')
              print('bundles may silently serve predictions from the old model code.')
              print('Bump MODEL_VERSION in src/bundle_cache.py.')
              sys.exit(1)
          else:
              print('MODEL_VERSION check passed.')
          "
        continue-on-error: true   # warning only, not blocking

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with notebook extras
        run: pip install --upgrade pip && pip install -e ".[notebooks]"

      - name: Execute notebooks
        # notebooks/_run_ci.py strips any cell tagged "skip-ci" before execution
        # (for a future notebook that needs a large one-time download this repo
        # doesn't commit) and fails the job if any remaining cell errors. Uses
        # nbclient directly rather than `jupyter nbconvert --execute
        # --TagRemovePreprocessor...`, which was verified NOT to actually strip
        # tagged cells before execution in this project's nbconvert version —
        # see the script's own docstring for how that was confirmed.
        run: python notebooks/_run_ci.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with docs extras
        run: pip install --upgrade pip && pip install -e ".[docs]"

      - name: Build docs (strict — broken links/nav fail the build)
        run: mkdocs build --strict

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
        continue-on-error: false

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Check FEATURE_VERSION bumped when feature engineering changed
        run: |
          python -c "
          import subprocess, sys

          # Get list of changed files
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print('FEATURE_VERSION check skipped (no prior commit).')
              sys.exit(0)
          changed = result.stdout.strip().splitlines()

          # batlab/features/engineering.py holds build_features(); two independent
          # FEATURE_VERSION tags depend on it staying honest: the app's disk cache
          # (src/bundle_cache.py) and the reproducible-benchmark manifest schema
          # (batlab/validation/manifest.py).
          features_changed = any(f == 'batlab/features/engineering.py' for f in changed)
          bundle_changed    = any(f == 'src/bundle_cache.py' for f in changed)
          manifest_changed  = any(f == 'batlab/validation/manifest.py' for f in changed)

          if features_changed and not (bundle_changed or manifest_changed):
              print('WARNING: batlab/features/engineering.py changed but neither')
              print('src/bundle_cache.py (app disk-cache FEATURE_VERSION) nor')
              print('batlab/validation/manifest.py (benchmark-manifest FEATURE_VERSION)')
              print('was updated. Stale caches/manifests may silently serve results from')
              print('the old feature-engineering code. Bump the relevant FEATURE_VERSION.')
              sys.exit(1)
          else:
              print('FEATURE_VERSION check passed.')
          "
        continue-on-error: true   # warning only, not blocking

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with notebook extras
        run: pip install --upgrade pip && pip install -e ".[notebooks]"

      - name: Execute notebooks
        # notebooks/_run_ci.py strips any cell tagged "skip-ci" before execution
        # (for a future notebook that needs a large one-time download this repo
        # doesn't commit) and fails the job if any remaining cell errors. Uses
        # nbclient directly rather than `jupyter nbconvert --execute
        # --TagRemovePreprocessor...`, which was verified NOT to actually strip
        # tagged cells before execution in this project's nbconvert version —
        # see the script's own docstring for how that was confirmed.
        run: python notebooks/_run_ci.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install batlab with docs extras
        run: pip install --upgrade pip && pip install -e ".[docs]"

      - name: Build docs (strict — broken links/nav fail the build)
        run: mkdocs build --strict

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    # The full suite is ~20 min on a 12-core dev machine with a warm
    # bundle cache; a 4-vCPU runner starts with no cache, so the first
    # AppTest per fleet retrains it. 15 min was killing the job mid-suite
    # (GitHub reports that as "cancelled", not "failure" — the 2026-09-12
    # runs at e36db4f/2c0fd51 and the first run of 4322f58 all died here).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # constraints.txt pins the numeric stack (numpy/pandas/scikit-learn/
        # scipy/pybamm): the metric gate's fixture-fleet numbers must be
        # comparable across runs, and an unpinned library bump can change
        # GBRT fits (see batlab/validation/manifest.py). Re-pin deliberately.
        run: pip install --upgrade pip && pip install -r requirements.txt -c constraints.txt && pip install -e . -c constraints.txt
        continue-on-error: false

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Type check with pyright
        # Bare `pyright`: the checked paths and the Python version live in
        # pyproject.toml's [tool.pyright], the single source of truth. A path
        # list inline here is how `batlab/` (the installable library, the
        # batlab.harness package the app plugs into) came to be type-checked by
        # nobody for its whole life. Pinned to match the `dev` extra — the
        # config below is tuned against this pyright's numpy/pandas diagnostics.
        run: |
          pip install pyright==1.1.414
          pyright

      - name: Run test suite
        # pytest's exit code decides this step. The annotator that follows only
        # makes the failures READABLE: a job log needs a signed-in browser (the
        # REST logs endpoint answers 403 even for a public repo), while
        # check-run annotations are in the public API -- so a suite that fails
        # only in the log is a suite nothing can triage. `set +e` because the
        # runner's shell is `bash -e`, which would otherwise abort before a
        # single failure could be annotated; writing the report to $RUNNER_TEMP
        # keeps it out of the checkout.
        run: |
          set +e
          python -m pytest tests/ -v --junitxml="$RUNNER_TEMP/pytest-junit.xml"
          pytest_code=$?
          python scripts/annotate_pytest_failures.py "$RUNNER_TEMP/pytest-junit.xml" \
            || echo "::warning::could not annotate the failures — see the log above"
          exit "$pytest_code"

      - name: Audit knowledge graph provenance
        run: python scripts/audit_knowledge_graph_provenance.py

      - name: Check MODEL_VERSION bumped when model training code changed
        # Logic lives in scripts/check_model_version_bump.py (unit-tested in
        # tests/test_check_model_version_bump.py) rather than inline here --
        # an inline-only check has no way to verify it actually still catches
        # what it's meant to catch.
        run: python scripts/check_model_version_bump.py
        continue-on-error: true   # warning only, not blocking

      - name: Metric gate (accuracy regression)
        # The fixture-fleet gate runs as a marked test inside the suite; this
        # dedicated step also gates the REAL logged runs against
        # config/metric_gate_expectations.json when that file exists. A
        # failing gate means a headline number moved without an explained,
        # recorded reason -- run scripts/update_metric_baselines.py to
        # record it, never edit baselines silently.
        run: python scripts/check_metric_gate.py
        continue-on-error: false

  frontend:
    # The React SPA (frontend/) had no CI job at all until now: it built and
    # linted clean when run by hand, which is a property that stops being true
    # exactly when nobody runs it. Three gates, each one a way for the built
    # artifact to be wrong in a way a reader of the source would not catch --
    # a type error, a stale bundle, or an accessibility defect. `npm run build`
    # is `tsc -b && vite build`, so the type check cannot drift from what
    # actually ships; `npm run lint` carries oxlint's jsx-a11y plugin (see
    # frontend/.oxlintrc.json), which is the accessibility gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check and build
        run: npm run build
        working-directory: frontend

      - name: Lint (including jsx-a11y)
        run: npm run lint
        working-directory: frontend

      - name: Check the build output is the layout the API serves
        # src/api.py mounts frontend/dist at /app. A build that emitted
        # somewhere else, or an index.html pointing at an asset that was not
        # written, would leave /app as a boot-time 404 with every gate above
        # still green — so assert the two things the mount actually needs.
        # (The mount itself is covered by tests/test_api_serves_spa.py in the
        # Python job, which mounts a fake dist and needs no Node.)
        run: |
          python - <<'PY'
          import re, pathlib, sys
          index = pathlib.Path("frontend/dist/index.html")
          if not index.is_file():
              sys.exit("frontend/dist/index.html missing after build")
          refs = re.findall(r'(?:src|href)="([^"]+)"', index.read_text(encoding="utf-8"))
          missing = [r for r in refs if r.startswith("/") and not (pathlib.Path("frontend/dist") / r.lstrip("/")).is_file()]
          if missing:
              sys.exit(f"index.html references assets that were not built: {missing}")
          print("dist layout OK:", len(refs), "asset references resolved")
          PY

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install batlab with notebook extras
        run: pip install --upgrade pip && pip install -e ".[notebooks]"

      - name: Execute notebooks
        # notebooks/_run_ci.py strips any cell tagged "skip-ci" before execution
        # (for a future notebook that needs a large one-time download this repo
        # doesn't commit) and fails the job if any remaining cell errors. Uses
        # nbclient directly rather than `jupyter nbconvert --execute
        # --TagRemovePreprocessor...`, which was verified NOT to actually strip
        # tagged cells before execution in this project's nbconvert version —
        # see the script's own docstring for how that was confirmed.
        run: python notebooks/_run_ci.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install batlab with docs extras
        run: pip install --upgrade pip && pip install -e ".[docs]"

      - name: Build docs (strict — broken links/nav fail the build)
        run: mkdocs build --strict

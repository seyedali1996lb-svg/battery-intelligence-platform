[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batlab"
version = "0.1.1"
description = "A citable, honest research library for battery degradation analysis: standardized dataset loaders, leave-cell-out-validated SOH/RUL models, and reproducible benchmark manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ali Hosseini" },
]
keywords = ["battery", "lithium-ion", "state-of-health", "remaining-useful-life", "degradation", "machine-learning", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "requests",
]

[project.optional-dependencies]
# Extra parsers only needed by specific dataset loaders -- not required to
# install batlab itself, only to actually download+parse that one dataset.
severson = ["h5py"]
oxford = ["mat-io"]
calce = ["openpyxl"]
notebooks = ["jupyter", "matplotlib", "papermill", "nbconvert", "ipykernel"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]
# pyright is pinned: its diagnostics move between releases (the numpy/pandas
# stub interactions this config is tuned against are version-specific), so an
# unpinned checker turns someone else's release into a red CI run. Bump this
# and the `pip install` in .github/workflows/ci.yml together, deliberately.
dev = ["pytest", "pyright==1.1.414", "batlab[severson,oxford,calce,notebooks,docs]"]

[project.urls]
Homepage = "https://github.com/seyedali1996lb-svg/battery-intelligence-platform"
Repository = "https://github.com/seyedali1996lb-svg/battery-intelligence-platform"
Documentation = "https://seyedali1996lb-svg.github.io/battery-intelligence-platform/"
DOI = "https://doi.org/10.5281/zenodo.21346275"

[tool.setuptools.packages.find]
include = ["batlab*"]

[tool.pyright]
pythonVersion = "3.10"
# THE list of type-checked paths, and the only one: CI runs bare `pyright` so
# this cannot drift from what actually gets checked. It did drift — an inline
# path list in the workflow omitted `batlab` entirely, so the installable
# library, including everything under batlab/harness, was never type-checked.
include = ["batlab", "src", "app", "scripts"]
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "standard"
# --- Suppressed categories (false positives at scale) ---
# reportMissingImports: bare imports resolve at runtime via _paths.py sys.path;
#   pyright can't see the dynamic path setup, so these are always false positives.
reportMissingImports = false
reportMissingTypeStubs = false
# reportAttributeAccessIssue: Streamlit's session_state is a dynamic dict-like
#   object; pyright flags every attribute access as unknown.
reportAttributeAccessIssue = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
# --- Active checks (real errors we want to catch) ---
reportCallIssue = true
reportReturnType = true
reportArgumentType = true
reportGeneralTypeIssues = true
reportOperatorIssue = true
reportOptionalSubscript = true
reportIndexIssue = true
reportUndefinedVariable = true
reportPossiblyUnboundVariable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "metric_gate: the CI accuracy regression gate (fixture-fleet LCO vs declared floors/baselines)",
]

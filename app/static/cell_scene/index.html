<!doctype html>
<!--
  The 3D cell scene, as a plain page. No framework, no build step, no bundler.

  Three hosts render this same scene — the Streamlit page, the React SPA and
  this page — and this is the one that proves the scene is a portable capability
  rather than a widget: it is a file, it loads the committed bundle next to it
  (`cell_scene.js`) and a scene document, and it does everything the other hosts
  do. Open it from the Streamlit app at /app/static/cell_scene/index.html, from
  the API at /scene/index.html, or serve this directory with any static server.

  Where the scene document comes from, in order of preference:

    ?cell=B0005          → GET {api}/cells/B0005/scene   (the REST surface)
    ?spec=./some.json    → any URL serving a CellSceneSpec
    (nothing)            → ./sample_scene.json           (committed by
                            scripts/export_scene_sample.py, so this page works
                            offline and in a fresh checkout)

  A browser will not let a file:// page fetch another file, so opening this with
  a double-click falls back to the sample scene embedded in the page below —
  which is the point of committing it. `?api=` and `?token=` exist because the
  REST endpoint is authenticated; the token is never sent anywhere else.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cell scene — 3D battery view</title>
    <style>
      :root {
        --bg: #0b1120;
        --panel: #111827;
        --line: #1f2937;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #63b3ed;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 400 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .layout {
        display: grid; grid-template-columns: 260px minmax(280px, 1fr) 320px;
        gap: 14px; padding: 14px 18px 28px; align-items: start;
      }
      @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px 13px;
      }
      .card h2 {
        margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--muted);
      }
      label.row {
        display: block; margin-bottom: 12px; font-size: 12px; color: var(--muted);
      }
      label.row span.value { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--accent); }
      button {
        background: #17202f; color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: #1c3a5a; border-color: #2c5282; }
      .row-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      .toggles label { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 12px; }
      #stage { position: relative; height: 62vh; min-height: 380px; background: var(--bg);
               border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      #state { display: flex; align-items: baseline; gap: 12px; padding: 0 4px 10px; }
      #state .soh { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
      #state .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); }
      #state .cycle { color: var(--muted); font-size: 12px; }
      #scale-note { margin: 8px 4px 0; color: var(--muted); font-size: 11.5px; }
      ul.parts { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; }
      ul.parts li {
        border-left: 2px solid var(--line); padding: 6px 8px; margin-bottom: 6px;
        background: #0e1524; border-radius: 4px; cursor: pointer;
      }
      ul.parts li.highlight { background: #16213a; }
      ul.parts li.unavailable { opacity: 0.72; }
      ul.parts .name { font-weight: 500; }
      ul.parts .value { float: right; font-variant-numeric: tabular-nums; }
      ul.parts .why { color: var(--muted); font-size: 11px; margin-top: 3px; }
      ul.parts .tag { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      details.disclosure { margin-top: 10px; }
      details.disclosure summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      details.disclosure ul { margin: 8px 0 0 16px; padding: 0; color: var(--muted); font-size: 11.5px; }
      #legend { margin-top: 10px; }
      #error { color: #fc8181; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Cell scene</h1>
      <p id="subtitle">A single cell, its anatomy, and the measurements behind every part.</p>
    </header>

    <div class="layout">
      <section class="card">
        <h2>Controls</h2>
        <label class="row">
          Exploded view <span class="value" id="explode-value">0%</span>
          <input id="explode" type="range" min="0" max="100" value="0" />
        </label>
        <label class="row">
          <span>Life cursor</span> <span class="value" id="cursor-value">—</span>
          <input id="cursor" type="range" min="0" max="1" value="0" />
        </label>
        <div class="row-buttons" style="margin-bottom: 12px">
          <button id="play" class="primary">▶ Play life</button>
          <button id="today">Today</button>
          <button id="reset">Reset view</button>
        </div>
        <div class="toggles">
          <label><input id="data-scaled" type="checkbox" /> Data-scaled geometry</label>
          <label><input id="annotations" type="checkbox" checked /> Part annotations</label>
          <label><input id="strip-casing" type="checkbox" /> Strip the casing</label>
        </div>
        <div id="legend"></div>
      </section>

      <section>
        <div id="state">
          <span class="soh" id="soh">—</span>
          <span class="badge" id="status">—</span>
          <span class="cycle" id="cycle"></span>
        </div>
        <div id="stage"></div>
        <p id="scale-note"></p>
        <p id="error"></p>
      </section>

      <section class="card">
        <h2>Anatomy — inspected parts</h2>
        <ul class="parts" id="parts"></ul>
        <details class="disclosure">
          <summary>What this view does and does not claim</summary>
          <ul id="disclosures"></ul>
        </details>
      </section>
    </div>

    <script src="cell_scene.js"></script>
    <script>
      // The fallback scene, committed next to this page by
      // scripts/export_scene_sample.py so the file works offline.
      const params = new URLSearchParams(location.search);
      const apiBase = params.get("api") || "";
      const token = params.get("token") || "";
      const cell = params.get("cell");

      async function loadSpec() {
        const explicit = params.get("spec");
        if (cell) {
          const headers = token ? { Authorization: `Bearer ${token}` } : {};
          const response = await fetch(
            `${apiBase}/cells/${encodeURIComponent(cell)}/scene`,
            { headers },
          );
          if (!response.ok) throw new Error(`the API answered ${response.status} for ${cell}`);
          return { spec: await response.json(), source: `GET ${apiBase}/cells/${cell}/scene` };
        }
        const url = explicit || "sample_scene.json";
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url} answered ${response.status}`);
        return { spec: await response.json(), source: url };
      }

      const el = (id) => document.getElementById(id);
      const formatValue = (value) => {
        if (value === null || value === undefined || Number.isNaN(value)) return "—";
        const magnitude = Math.abs(value);
        const decimals = magnitude >= 100 ? 1 : magnitude >= 10 ? 2 : 3;
        return value.toFixed(decimals);
      };
      let scene = null;
      let spec = null;
      let cursor = 0;

      function paintChrome(state) {
        el("soh").textContent = state.soh === null ? "no reading" : `${state.soh.toFixed(1)}%`;
        el("soh").style.color = state.gaugeColor;
        el("status").textContent = state.gaugeLabel;
        el("status").style.borderColor = state.gaugeColor;
        el("cycle").textContent =
          (state.cycle === null ? "" : `cycle ${Math.round(state.cycle)}`) +
          (state.projected ? ` · ${state.projectionLabel || "projected"}` : " · measured");
        el("scale-note").textContent = state.scaleNote || "";
        el("cursor-value").textContent =
          `${state.cursor + 1} / ${state.measuredCount + (state.projectionLength || 0)}`;
      }

      function paintParts(state) {
        const list = el("parts");
        list.innerHTML = "";
        // The readings come from the engine, not from the document: the
        // document's `value` is a single snapshot, so a card built from it would
        // keep showing today's number while the cursor scrubbed back through
        // the cell's life. `scene` is still null while the very first frame is
        // painted — mount() reports its state synchronously, before it returns
        // its handle — so the document is the fallback for that one frame only.
        const readings = scene
          ? scene.parts()
          : spec.parts.map((part) => ({ ...part, carried: false, reason: part.unavailableReason }));
        for (const part of readings) {
          const li = document.createElement("li");
          const value = part.value;
          const unit = part.unit ? ` <span class="tag">${part.unit}</span>` : "";
          li.className =
            (part.available ? "" : "unavailable") +
            (state.inspected === part.id ? " highlight" : "");
          li.style.borderLeftColor =
            spec.theme.provenanceColors[part.provenance] || spec.theme.muted;
          li.innerHTML =
            `<span class="value">${formatValue(value)}</span>` +
            `<span class="name">${part.label}</span>` +
            `<div><span class="tag">${part.provenance || "unmeasured"}</span>${unit}` +
            `${part.carried ? '<span class="tag"> · last measured</span>' : ""}</div>` +
            (part.available
              ? `<div class="why">${part.meaning}</div>`
              : `<div class="why">No measurement: ${part.reason || "not measured"}</div>`);
          li.addEventListener("click", () => focusPart(part.id));
          list.appendChild(li);
        }
      }

      function focusPart(id) {
        // Host-side inspection: rotate the camera to the part's own side. The
        // scene itself never moves geometry for a click.
        if (scene) scene.inspect(id);
      }

      function refresh(state) {
        paintChrome(state);
        paintParts(state);
      }

      function setPlayLabel(playing) {
        el("play").textContent = playing ? "⏸ Pause" : "▶ Play life";
      }

      async function main() {
        let loaded;
        try {
          loaded = await loadSpec();
        } catch (error) {
          el("error").textContent =
            `Could not load a scene (${error.message}). Serve this directory over HTTP ` +
            `(e.g. python -m http.server) or pass ?cell=... with an API base.`;
          return;
        }
        spec = loaded.spec;
        const mounted = window.CellScene.mount(el("stage"), spec, {
          cursor: spec.series.cycles.length - 1,
          onFrame: refresh,
          // The engine stops at the end of the timeline; the button is ours, so
          // putting its label back is ours too.
          onPlaybackEnd: () => setPlayLabel(false),
        });
        if (!mounted.handle) {
          el("error").textContent = mounted.error || "The scene could not start.";
          return;
        }
        scene = mounted.handle;
        window.CellScene.renderLegend(el("legend"), spec.theme);

        el("title").textContent = `${spec.cell.id} — 3D cell scene`;
        el("subtitle").textContent =
          `${spec.cell.source || "unknown source"} · ${spec.cell.chemistry || "chemistry undeclared"} · ` +
          `scene from ${loaded.source}`;
        document.documentElement.style.setProperty("--bg", spec.theme.background);
        document.documentElement.style.setProperty("--panel", spec.theme.panel);
        document.documentElement.style.setProperty("--text", spec.theme.text);
        document.documentElement.style.setProperty("--muted", spec.theme.muted);
        document.documentElement.style.setProperty("--accent", spec.theme.accent);

        const total = spec.series.cycles.length + (spec.projection.cycles ? spec.projection.cycles.length : 0);
        el("cursor").max = String(total - 1);
        el("cursor").value = String(spec.series.cycles.length - 1);
        el("cursor").addEventListener("input", (event) => {
          scene.setCursor(Number(event.target.value));
        });
        el("explode").addEventListener("input", (event) => {
          const exploded = Number(event.target.value) / 100;
          el("explode-value").textContent = `${event.target.value}%`;
          scene.update(spec, { exploded });
        });
        el("data-scaled").addEventListener("change", (event) => {
          scene.update(spec, { dataScaled: event.target.checked });
        });
        el("strip-casing").addEventListener("change", (event) => {
          scene.update(spec, { casing: event.target.checked ? "hidden" : "translucent" });
        });
        el("annotations").addEventListener("change", (event) => {
          scene.setAnnotations(event.target.checked);
        });
        el("play").addEventListener("click", () => {
          if (scene.isPlaying()) {
            scene.pause();
            setPlayLabel(false);
            return;
          }
          // play() answers false only when there is no life to play, and the
          // label must not claim otherwise.
          setPlayLabel(scene.play() === true);
        });
        el("today").addEventListener("click", () => {
          const today = spec.series.cycles.length - 1;
          el("cursor").value = String(today);
          scene.setCursor(today);
        });
        el("reset").addEventListener("click", () => scene.resetView());

        const list = el("disclosures");
        for (const text of spec.disclosures) {
          const li = document.createElement("li");
          li.textContent = text;
          list.appendChild(li);
        }
      }

      main();
    </script>
  </body>
</html>
